name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Build site
        run: |
          mkdir -p _site
          pandoc content.md \
            --standalone \
            --template template.html \
            --section-divs \
            --output _site/index.html
          # Copy pre-built HTML subpages (e.g. R-generated maps)
          [ -d maps ] && cp -r maps _site/maps || true
          # Copy static assets (images etc.)
          [ -d assets ] && cp -r assets _site/assets || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

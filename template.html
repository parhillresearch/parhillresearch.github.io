<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$if(title)$$title$$else$Par Hill Research$endif$</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #1d4ed8;
      --border: #e5e7eb;
      --max-w: 720px;
      --nav-h: 3.5rem;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* ── Navigation ── */

    nav {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      padding: 0 1.5rem;
    }

    nav .inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--nav-h);
    }

    .site-name {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    nav a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    nav a:hover {
      color: var(--accent);
    }

    /* ── Main content ── */

    main {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }

    /* Offset for sticky nav when jumping to anchors */
    section {
      scroll-margin-top: calc(var(--nav-h) + 1.5rem);
      margin-bottom: 4rem;
    }

    /* ── Section headings (About, Portfolio, Contact) ── */

    section > h2 {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }

    /* ── About ── */

    #about > p {
      font-size: 1.05rem;
      color: var(--text);
      max-width: 62ch;
    }

    /* ── Portfolio project entries ── */

    section section {
      margin-bottom: 0;
    }

    section section > h3 {
      font-size: 0.975rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    section section > p {
      font-size: 0.925rem;
      color: var(--muted);
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    section section:last-child > p {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    /* ── Contact ── */

    #contact > p {
      font-size: 0.975rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    #contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    #contact a:hover {
      text-decoration: underline;
    }

    /* ── Responsive ── */

    /* ── Footer ── */

    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
    }

    footer p {
      max-width: var(--max-w);
      margin: 0 auto;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ── Responsive ── */

    @media (max-width: 540px) {
      nav ul {
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="inner">
      <a href="#" class="site-name">Par Hill Research</a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main>
    $body$
  </main>
  <footer>
    <p>Par Hill Research is the trading name of Parliament Hill Research Ltd, registered in England &amp; Wales. Company number 15477427.</p>
  </footer>
</body>
</html>

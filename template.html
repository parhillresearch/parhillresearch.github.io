<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$if(title)$$title$$else$Portfolio$endif$</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f9fafb;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --max-w: 680px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header .inner {
      max-width: var(--max-w);
      margin: 0 auto;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    main {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 3.5rem 1.5rem 6rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    h1 + p {
      color: var(--muted);
      font-size: 0.975rem;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }

    h2 {
      font-size: 0.975rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    h2 ~ p {
      color: var(--muted);
      font-size: 0.925rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }

    h2:last-of-type ~ p {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">$if(title)$$title$$else$Portfolio$endif$</div>
  </header>
  <main>
    $body$
  </main>
</body>
</html>
